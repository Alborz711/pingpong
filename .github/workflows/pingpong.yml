name: pingpong

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post the next session's poll right now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pingpong

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FORCE: ${{ inputs.force }}
        run: python3 run.py
      - name: Save state
        run: |
          git config user.name "pingpong-bot"
          git config user.email "pingpong-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
